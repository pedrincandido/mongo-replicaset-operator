# This rule is not used by the project mongo-replicaset-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to db.pedrincandido.dev resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mongo-replicaset-operator
    app.kubernetes.io/managed-by: kustomize
  name: mongoreplicaset-viewer-role
rules:
- apiGroups:
  - db.pedrincandido.dev
  resources:
  - mongoreplicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - db.pedrincandido.dev
  resources:
  - mongoreplicasets/status
  verbs:
  - get
