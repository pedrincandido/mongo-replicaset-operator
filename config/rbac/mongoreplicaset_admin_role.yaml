# This rule is not used by the project mongo-replicaset-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over db.pedrincandido.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mongo-replicaset-operator
    app.kubernetes.io/managed-by: kustomize
  name: mongoreplicaset-admin-role
rules:
- apiGroups:
  - db.pedrincandido.dev
  resources:
  - mongoreplicasets
  verbs:
  - '*'
- apiGroups:
  - db.pedrincandido.dev
  resources:
  - mongoreplicasets/status
  verbs:
  - get
